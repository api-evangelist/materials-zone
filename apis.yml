aid: materials-zone
name: Materials Zone
description: >-
  Materials Zone (MaterialsZone) is a materials-informatics platform that centralizes materials
  R&D data into a single, structured source of truth. Its RESTful API integrates with lab
  instruments and supports Python scripts and analytical tools, letting teams automate workflows,
  connect diverse data sources, and run domain-specific analysis. Data is organized as
  Folders > Tables > Items, enriched with Parameters, Values, Measurements, Protocols and Parsers,
  with per-organization data segregation and encryption in transit and at rest. The company is a
  portfolio company of Insight Partners.
